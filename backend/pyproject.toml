[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wagelpaw-backend"
version = "0.1.0"
description = "Independent Wagelpaw commerce and generation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0.38,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "Pillow>=11.1,<13",
  "psycopg[binary]>=3.2,<4",
  "ShopifyAPI==12.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.domain" = ["data/*.json"]
"app.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

